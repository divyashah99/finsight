[project]
name = "finsight-api"
version = "0.1.0"
description = "FinSight backend — multi-agent equity research API"
requires-python = ">=3.11"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "httpx>=0.27",

    # config & validation
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # db
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",

    # ai / agents
    "openai>=1.55",
    "langchain>=1.0",          # provides langchain.agents.create_agent
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",  # durable conversation memory
    "psycopg[binary]>=3.2",                # libpq wrapper for the checkpointer
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-mcp-adapters>=0.1",         # expose MCP tools to the analyst agent

    # MCP — Anthropic's Model Context Protocol
    "mcp>=1.0.0",

    # vector
    "qdrant-client>=1.12",
    "fastembed>=0.4",          # sparse BM25 embeddings for hybrid search

    # data / quant
    "pandas>=2.2",
    "numpy>=2.0",

    # sec
    "beautifulsoup4>=4.12",
    "lxml>=5.3",

    # infra
    "apscheduler>=3.10",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finsight"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
